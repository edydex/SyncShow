<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file:;">
  <title>SyncShow - Singer Screen</title>
  <link rel="stylesheet" href="translation-display.css">
  <link rel="stylesheet" href="bible-overlay.css">
  <style>
    @font-face {font-family:"SyncShow Presentation";src:url("../../assets/fonts/LiberationSans-Regular.ttf") format("truetype");font-weight:100 500;font-style:normal;font-display:block;}
    @font-face {font-family:"SyncShow Presentation";src:url("../../assets/fonts/LiberationSans-Bold.ttf") format("truetype");font-weight:600 900;font-style:normal;font-display:block;}
    @font-face {font-family:"SyncShow Presentation";src:url("../../assets/fonts/LiberationSans-Italic.ttf") format("truetype");font-weight:100 500;font-style:italic;font-display:block;}
    @font-face {font-family:"SyncShow Presentation";src:url("../../assets/fonts/LiberationSans-BoldItalic.ttf") format("truetype");font-weight:600 900;font-style:italic;font-display:block;}
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: Arial, "SyncShow Presentation", sans-serif;
    }
    
    .singer-container {
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 15px;
    }
    
    /* Main content - two rows */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
      min-height: 0;
    }
    
    /* Current slide image - takes all remaining space */
    .current-slide-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0a0a15;
      border-radius: 12px;
      overflow: hidden;
      min-height: 0;
    }
    
    .current-slide-image {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
      min-height: 0;
    }
    
    .current-slide-image img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 4px;
    }
    
    .current-slide-image .waiting {
      color: #444;
      font-size: 24px;
    }
    
    /* Next slide text preview - sized by content (font + padding) */
    .next-slide-section {
      flex: none;
      display: flex;
      flex-direction: column;
      border-top: 0.75rem dashed cyan;
      overflow: hidden;
    }

    .next-text {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px 30px;
      color: #fff;
      font-size: 36px;
      font-weight: 400;
      line-height: 1.3;
      text-align: center;
      overflow: hidden;
    }
    
    .next-text.small {
      font-size: 28px;
    }
    
    .next-text.very-small {
      font-size: 22px;
    }
    
    .next-text .waiting {
      color: #555;
      font-size: 20px;
    }
    
    .next-text .end-slide {
      color: #666;
      font-style: italic;
      font-size: 24px;
    }
    
    /* Cleared/black screen state */
    .singer-container.cleared .main-content {
      display: none;
    }

    .output-restore-guard {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #000;
      pointer-events: none;
    }

    .output-restore-guard[hidden] {
      display: none;
    }

  </style>
</head>
<body>
  <div class="singer-container" id="singerContainer">
    <div class="main-content">
      <!-- Current slide image -->
      <div class="current-slide-section">
        <div class="current-slide-image" id="currentSlideContainer">
          <div class="waiting">Waiting for presentation...</div>
        </div>
      </div>
      
      <!-- Next slide text -->
      <div class="next-slide-section">
        <div class="next-text" id="nextText">
          <div class="waiting">Ready to display next slide preview</div>
        </div>
      </div>
    </div>

    <section class="bible-overlay" id="bibleOverlay" aria-live="polite" hidden>
      <h1 class="bible-reference" id="bibleReference"></h1>
      <div class="bible-verses" id="bibleVerses"></div>
      <footer class="bible-footer">
        <span class="bible-translation" id="bibleTranslation"></span>
        <span class="bible-attribution" id="bibleAttribution"></span>
      </footer>
    </section>

    <section class="bible-overlay staging" id="bibleOverlayStaging" aria-hidden="true" hidden>
      <h1 class="bible-reference" id="bibleReferenceStaging"></h1>
      <div class="bible-verses" id="bibleVersesStaging"></div>
      <footer class="bible-footer">
        <span class="bible-translation" id="bibleTranslationStaging"></span>
        <span class="bible-attribution" id="bibleAttributionStaging"></span>
      </footer>
    </section>

    <div class="output-restore-guard" id="outputRestoreGuard" aria-hidden="true" hidden></div>
  </div>
  
  <script src="output-viewport.js"></script>
  <script src="bible-overlay.js"></script>
  <script src="singer.js"></script>
  <script src="translation-display.js"></script>
</body>
</html>
