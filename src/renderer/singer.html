<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file:;">
  <title>SyncShow - Singer Screen</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    
    .singer-container {
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 15px;
    }
    
    /* Main content - two rows */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
      min-height: 0;
    }
    
    /* Current slide image - takes all remaining space */
    .current-slide-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0a0a15;
      border-radius: 12px;
      overflow: hidden;
      min-height: 0;
    }
    
    .current-slide-image {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
      min-height: 0;
    }
    
    .current-slide-image img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 4px;
    }
    
    .current-slide-image .waiting {
      color: #444;
      font-size: 24px;
    }
    
    /* Next slide text preview - sized by content (font + padding) */
    .next-slide-section {
      flex: none;
      display: flex;
      flex-direction: column;
      border-top: 0.75rem dashed cyan;
      overflow: hidden;
    }

    .next-text {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px 30px;
      color: #fff;
      font-size: 36px;
      font-weight: 400;
      line-height: 1.3;
      text-align: center;
      overflow: hidden;
    }
    
    .next-text.small {
      font-size: 28px;
    }
    
    .next-text.very-small {
      font-size: 22px;
    }
    
    .next-text .waiting {
      color: #555;
      font-size: 20px;
    }
    
    .next-text .end-slide {
      color: #666;
      font-style: italic;
      font-size: 24px;
    }
    
    /* Cleared/black screen state */
    .singer-container.cleared .main-content {
      display: none;
    }

    .bible-overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 4vh;
      padding: 7vh 8vw 5vh;
      color: #fff;
      background:
        radial-gradient(circle at 78% 14%, rgba(70, 92, 150, 0.24), transparent 32%),
        linear-gradient(145deg, #07101f 0%, #101a31 58%, #080d18 100%);
    }

    .bible-overlay[hidden] {
      display: none;
    }

    .bible-overlay.staging {
      visibility: hidden;
      pointer-events: none;
    }

    .bible-reference {
      color: #c9d5f9;
      font-size: clamp(30px, 3.2vw, 62px);
      font-weight: 750;
      letter-spacing: -0.02em;
    }

    .bible-verses {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.34em;
      max-width: 1500px;
      overflow: hidden;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(38px, 4.15vw, 78px);
      line-height: 1.28;
      text-wrap: balance;
    }

    .bible-overlay.medium .bible-verses {
      font-size: clamp(34px, 3.45vw, 64px);
    }

    .bible-overlay.long .bible-verses {
      font-size: clamp(28px, 2.75vw, 52px);
    }

    .bible-overlay.compact {
      gap: 2.5vh;
      padding-top: 5vh;
      padding-bottom: 4vh;
    }

    .bible-overlay.compact .bible-verses {
      gap: 0.22em;
      font-size: clamp(24px, 2.25vw, 42px);
      line-height: 1.2;
    }

    .bible-verse-number {
      margin-right: 0.32em;
      color: #aabcf0;
      font-size: 0.48em;
      font-weight: 800;
      vertical-align: super;
    }

    .bible-footer {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 3vw;
      color: rgba(226, 232, 249, 0.72);
      font-size: clamp(14px, 1.15vw, 23px);
    }

    .bible-translation {
      flex: 0 0 auto;
      color: #dce5ff;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    .bible-attribution {
      max-width: 70%;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="singer-container" id="singerContainer">
    <div class="main-content">
      <!-- Current slide image -->
      <div class="current-slide-section">
        <div class="current-slide-image" id="currentSlideContainer">
          <div class="waiting">Waiting for presentation...</div>
        </div>
      </div>
      
      <!-- Next slide text -->
      <div class="next-slide-section">
        <div class="next-text" id="nextText">
          <div class="waiting">Ready to display next slide preview</div>
        </div>
      </div>
    </div>

    <section class="bible-overlay" id="bibleOverlay" aria-live="polite" hidden>
      <h1 class="bible-reference" id="bibleReference"></h1>
      <div class="bible-verses" id="bibleVerses"></div>
      <footer class="bible-footer">
        <span class="bible-translation" id="bibleTranslation"></span>
        <span class="bible-attribution" id="bibleAttribution"></span>
      </footer>
    </section>

    <section class="bible-overlay staging" id="bibleOverlayStaging" aria-hidden="true" hidden>
      <h1 class="bible-reference" id="bibleReferenceStaging"></h1>
      <div class="bible-verses" id="bibleVersesStaging"></div>
      <footer class="bible-footer">
        <span class="bible-translation" id="bibleTranslationStaging"></span>
        <span class="bible-attribution" id="bibleAttributionStaging"></span>
      </footer>
    </section>
  </div>
  
  <script src="bible-overlay.js"></script>
  <script src="singer.js"></script>
</body>
</html>
