name: Build and Release

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version_changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if version changed
        id: check
        run: |
          # Get current version
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"

          # Promotion owns alpha/beta/rc/dev. Preview builds remain explicit
          # prereleases and should proceed through this workflow unchanged.
          if [ "${{ github.event_name }}" = "push" ] && echo "$CURRENT_VERSION" | grep -qiE '[-](alpha|beta|rc|dev)'; then
            echo "Pre-release version $CURRENT_VERSION on push - deferring to promote-release workflow"
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if this is triggered manually (workflow_dispatch)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger - building version $CURRENT_VERSION"
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Get previous version (from previous commit)
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            git show HEAD~1:package.json > /tmp/old-package.json 2>/dev/null || echo '{"version":"0.0.0"}' > /tmp/old-package.json
            PREVIOUS_VERSION=$(node -p "require('/tmp/old-package.json').version")
          else
            PREVIOUS_VERSION="0.0.0"
          fi
          echo "Previous version: $PREVIOUS_VERSION"
          
          if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
            echo "Version changed from $PREVIOUS_VERSION to $CURRENT_VERSION"
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          else
            echo "Version unchanged"
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          fi

  build-windows:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true' && github.ref == 'refs/heads/main'
    environment: release-build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run syntax and regression checks
        run: npm run ci

      - name: Prepare Google Drive release configuration
        run: node scripts/google-drive-build-config.js inject
        env:
          SYNCSHOW_GOOGLE_CLIENT_ID: ${{ secrets.SYNCSHOW_GOOGLE_CLIENT_ID }}
          SYNCSHOW_GOOGLE_CLIENT_SECRET: ${{ secrets.SYNCSHOW_GOOGLE_CLIENT_SECRET }}
          SYNCSHOW_GOOGLE_API_KEY: ${{ secrets.SYNCSHOW_GOOGLE_API_KEY }}

      - name: Build Windows installer
        run: npm run build:win
        env:
          SYNCSHOW_PACKAGE_GOOGLE_DRIVE_CONFIG: '1'

      - name: Verify packaged PDF engine
        run: npm run build:verify-pdf-engine

      - name: Verify Google Drive release configuration was packaged
        run: node scripts/google-drive-build-config.js verify

      - name: Enforce public-release legal materials
        run: npm run build:verify-release-legal

      - name: Remove Google Drive release configuration
        if: always()
        run: node scripts/google-drive-build-config.js clean

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
          retention-days: 30

  build-mac:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true' && github.ref == 'refs/heads/main'
    environment: release-build
    name: Build macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            file_arch: arm64
          - arch: x64
            runner: macos-15-intel
            file_arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run syntax and regression checks
        run: npm run ci

      - name: Prepare Google Drive release configuration
        run: node scripts/google-drive-build-config.js inject
        env:
          SYNCSHOW_GOOGLE_CLIENT_ID: ${{ secrets.SYNCSHOW_GOOGLE_CLIENT_ID }}
          SYNCSHOW_GOOGLE_CLIENT_SECRET: ${{ secrets.SYNCSHOW_GOOGLE_CLIENT_SECRET }}
          SYNCSHOW_GOOGLE_API_KEY: ${{ secrets.SYNCSHOW_GOOGLE_API_KEY }}

      - name: Build macOS installer
        run: npm run build:mac:adhoc -- --${{ matrix.arch }}
        env:
          SYNCSHOW_PACKAGE_GOOGLE_DRIVE_CONFIG: '1'

      - name: Verify packaged PDF engine
        run: npm run build:verify-pdf-engine

      - name: Verify Google Drive release configuration was packaged
        run: node scripts/google-drive-build-config.js verify

      - name: Verify native architecture
        shell: bash
        run: |
          APP_EXECUTABLE="$(find dist -path '*/SyncShow.app/Contents/MacOS/SyncShow' -type f | head -n 1)"
          SHARP_ADDON="$(find dist -path '*sharp-darwin-${{ matrix.arch }}*.node' -type f | head -n 1)"
          CANVAS_ADDON="$(find dist -path '*canvas-darwin-${{ matrix.arch }}*.node' -type f | head -n 1)"
          test -n "$APP_EXECUTABLE"
          test -n "$SHARP_ADDON"
          test -n "$CANVAS_ADDON"
          file "$APP_EXECUTABLE" | grep -q '${{ matrix.file_arch }}'
          file "$SHARP_ADDON" | grep -q '${{ matrix.file_arch }}'
          file "$CANVAS_ADDON" | grep -q '${{ matrix.file_arch }}'

      - name: Enforce public-release legal materials
        run: npm run build:verify-release-legal

      - name: Remove Google Drive release configuration
        if: always()
        run: node scripts/google-drive-build-config.js clean

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 30

  build-linux:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true' && github.ref == 'refs/heads/main'
    environment: release-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run syntax and regression checks
        run: npm run ci

      - name: Prepare Google Drive release configuration
        run: node scripts/google-drive-build-config.js inject
        env:
          SYNCSHOW_GOOGLE_CLIENT_ID: ${{ secrets.SYNCSHOW_GOOGLE_CLIENT_ID }}
          SYNCSHOW_GOOGLE_CLIENT_SECRET: ${{ secrets.SYNCSHOW_GOOGLE_CLIENT_SECRET }}
          SYNCSHOW_GOOGLE_API_KEY: ${{ secrets.SYNCSHOW_GOOGLE_API_KEY }}

      - name: Build Linux packages
        run: npm run build:linux
        env:
          SYNCSHOW_PACKAGE_GOOGLE_DRIVE_CONFIG: '1'

      - name: Verify packaged PDF engine
        run: npm run build:verify-pdf-engine

      - name: Verify Google Drive release configuration was packaged
        run: node scripts/google-drive-build-config.js verify

      - name: Enforce public-release legal materials
        run: npm run build:verify-release-legal

      - name: Remove Google Drive release configuration
        if: always()
        run: node scripts/google-drive-build-config.js clean

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: |
            dist/*.AppImage
            dist/*.deb
          retention-days: 30

  create-release:
    needs: [check-version, build-windows, build-mac, build-linux]
    if: needs.check-version.outputs.version_changed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        run: |
          NOTES=$(bash scripts/generate_release_notes.sh)
          # Write to multiline output
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Detect prerelease
        id: prerelease
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          if echo "$VERSION" | grep -qiE '[-](alpha|beta|rc|dev|preview)'; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: SyncShow v${{ needs.check-version.outputs.version }}
          draft: false
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          files: |
            artifacts/windows-installer/*.exe
            artifacts/macos-installer-*/*.dmg
            artifacts/macos-installer-*/*.zip
            artifacts/linux-installer/*.AppImage
            artifacts/linux-installer/*.deb
          body: |
            ## SyncShow v${{ needs.check-version.outputs.version }}

            ### What's New
            ${{ steps.notes.outputs.content }}

            ### Downloads
            - **Windows**: `SyncShow Setup ${{ needs.check-version.outputs.version }}.exe`
            - **macOS Apple Silicon**: `SyncShow-${{ needs.check-version.outputs.version }}-arm64.dmg`
            - **macOS Intel**: `SyncShow-${{ needs.check-version.outputs.version }}-x64.dmg`
            - **Linux**: `SyncShow-${{ needs.check-version.outputs.version }}.AppImage` or `.deb`

            ### Presentation converter requirements
            - **Windows:** Microsoft PowerPoint is preferred; [LibreOffice](https://www.libreoffice.org/download/download/) is the fallback.
            - **macOS/Linux:** LibreOffice must be installed.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
