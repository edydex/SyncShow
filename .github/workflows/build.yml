name: Build and Release

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version_changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
      preview: ${{ steps.check.outputs.preview }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if version changed
        id: check
        run: |
          # Get current version
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"
          echo "preview=false" >> "$GITHUB_OUTPUT"

          # Preview pushes and manual runs must produce tested installers, not
          # silently skip packaging or enter the credentialed public path.
          if echo "$CURRENT_VERSION" | grep -qiE '[-]preview([.]|$)'; then
            echo "Preview version: building testing installers on all four targets"
            echo "preview=true" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Testing preview

          This run builds Windows, Mac (Apple silicon and Intel), and Linux installers through **Package Smoke**. Each successful platform job provides a download link after its packaged-app checks pass. A green run means the preview packages were checked; it does not publish a public release.

          [Current permanent owner downloads and installation instructions](https://github.com/edydex/SyncShow/blob/main/docs/COMMUNITY_PREVIEW.md#download-and-install) are separate from the seven-day artifacts attached to this run. Google Drive release credentials are not required for Community and local presentation testing.
          SUMMARY
            exit 0
          fi

          # Promotion owns alpha/beta/rc/dev.
          if [ "${{ github.event_name }}" = "push" ] && echo "$CURRENT_VERSION" | grep -qiE '[-](alpha|beta|rc|dev)'; then
            echo "Pre-release version $CURRENT_VERSION on push - deferring to promote-release workflow"
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if this is triggered manually (workflow_dispatch)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger - building version $CURRENT_VERSION"
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Get previous version (from previous commit)
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            git show HEAD~1:package.json > /tmp/old-package.json 2>/dev/null || echo '{"version":"0.0.0"}' > /tmp/old-package.json
            PREVIOUS_VERSION=$(node -p "require('/tmp/old-package.json').version")
          else
            PREVIOUS_VERSION="0.0.0"
          fi
          echo "Previous version: $PREVIOUS_VERSION"
          
          if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
            echo "Version changed from $PREVIOUS_VERSION to $CURRENT_VERSION"
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          else
            echo "Version unchanged"
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          fi

  preview-packages:
    name: Testing installers
    needs: check-version
    if: needs.check-version.outputs.preview == 'true'
    uses: ./.github/workflows/package-smoke.yml

  prepare-sources:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Cache verified native source archives
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/syncshow-native-sources
          key: native-sources-${{ hashFiles('legal/release-sources/inputs.json') }}
      - name: Prepare exact dependency sources and notices
        run: node scripts/prepare-release-sources.js --output dist --cache '${{ runner.temp }}/syncshow-native-sources'
      - name: Upload corresponding-source release materials
        uses: actions/upload-artifact@v4
        with:
          name: corresponding-sources
          path: |
            dist/*-corresponding-sources.zip
            dist/release-source-receipt.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  build-windows:
    needs: [check-version, prepare-sources]
    env:
      SYNCSHOW_RELEASE_SOURCE_DIR: ${{ github.workspace }}/release-sources
    if: needs.check-version.outputs.version_changed == 'true' && github.ref == 'refs/heads/main'
    environment: release-build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run syntax and regression checks
        run: npm run ci

      - name: Download exact dependency source materials
        uses: actions/download-artifact@v4
        with:
          name: corresponding-sources
          path: release-sources

      - name: Build Windows installer
        run: npm run build:win
        env:
          SYNCSHOW_RELEASE_SOURCE_DIR: ${{ github.workspace }}/release-sources

      - name: Verify packaged PDF engine
        run: npm run build:verify-pdf-engine

      - name: Verify packaged Sharp runtime
        run: npm run build:verify-sharp -- --root dist

      - name: Verify packaged native service workflow
        run: npm run build:verify-service-core -- --root dist

      - name: Launch packaged application
        run: npm run build:verify-app-launch -- --root dist

      - name: Install and launch the Windows installer
        run: pwsh -NoProfile -File scripts/verify-windows-installer.ps1 -DistributionRoot dist

      - name: Record exact installer evidence
        run: >-
          npm run build:verify-package-smoke --
          --root dist
          --platform win32
          --arch x64
          --source-revision ${{ github.sha }}
          --manifest dist/package-smoke-windows-x64.json

      - name: Enforce public-release legal materials
        run: npm run build:verify-release-legal
        env:
          SYNCSHOW_RELEASE_SOURCE_DIR: ${{ github.workspace }}/release-sources

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/package-smoke-*.json
            dist/packaged-launch-*.json
          if-no-files-found: error
          retention-days: 30

  build-mac:
    needs: [check-version, prepare-sources]
    env:
      SYNCSHOW_RELEASE_SOURCE_DIR: ${{ github.workspace }}/release-sources
    if: needs.check-version.outputs.version_changed == 'true' && github.ref == 'refs/heads/main'
    environment: release-build
    name: Build macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            file_arch: arm64
          - arch: x64
            runner: macos-15-intel
            file_arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run syntax and regression checks
        run: npm run ci

      - name: Download exact dependency source materials
        uses: actions/download-artifact@v4
        with:
          name: corresponding-sources
          path: release-sources

      - name: Build macOS installer
        run: npm run build:mac:adhoc -- --${{ matrix.arch }}
        env:
          SYNCSHOW_RELEASE_SOURCE_DIR: ${{ github.workspace }}/release-sources

      - name: Verify packaged PDF engine
        run: npm run build:verify-pdf-engine

      - name: Verify native architecture
        shell: bash
        run: |
          APP_EXECUTABLE="$(find dist -path '*/SyncShow.app/Contents/MacOS/SyncShow' -type f | head -n 1)"
          SHARP_ADDON="$(find dist -path '*sharp-darwin-${{ matrix.arch }}*.node' -type f | head -n 1)"
          CANVAS_ADDON="$(find dist -path '*canvas-darwin-${{ matrix.arch }}*.node' -type f | head -n 1)"
          test -n "$APP_EXECUTABLE"
          test -n "$SHARP_ADDON"
          test -n "$CANVAS_ADDON"
          file "$APP_EXECUTABLE" | grep -q '${{ matrix.file_arch }}'
          file "$SHARP_ADDON" | grep -q '${{ matrix.file_arch }}'
          file "$CANVAS_ADDON" | grep -q '${{ matrix.file_arch }}'

      - name: Verify packaged Sharp runtime
        run: npm run build:verify-sharp -- --root dist

      - name: Verify packaged native service workflow
        run: npm run build:verify-service-core -- --root dist

      - name: Launch packaged application
        run: npm run build:verify-app-launch -- --root dist

      - name: Record exact installer evidence
        run: >-
          npm run build:verify-package-smoke --
          --root dist
          --platform darwin
          --arch ${{ matrix.arch }}
          --source-revision ${{ github.sha }}
          --manifest dist/package-smoke-mac-${{ matrix.arch }}.json

      - name: Enforce public-release legal materials
        run: npm run build:verify-release-legal
        env:
          SYNCSHOW_RELEASE_SOURCE_DIR: ${{ github.workspace }}/release-sources

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/package-smoke-*.json
            dist/packaged-launch-*.json
          if-no-files-found: error
          retention-days: 30

  build-linux:
    needs: [check-version, prepare-sources]
    env:
      SYNCSHOW_RELEASE_SOURCE_DIR: ${{ github.workspace }}/release-sources
    if: needs.check-version.outputs.version_changed == 'true' && github.ref == 'refs/heads/main'
    environment: release-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run syntax and regression checks
        run: npm run ci

      - name: Download exact dependency source materials
        uses: actions/download-artifact@v4
        with:
          name: corresponding-sources
          path: release-sources

      - name: Build Linux packages
        run: npm run build:linux
        env:
          SYNCSHOW_RELEASE_SOURCE_DIR: ${{ github.workspace }}/release-sources

      - name: Verify packaged PDF engine
        run: npm run build:verify-pdf-engine

      - name: Verify packaged Sharp runtime
        run: npm run build:verify-sharp -- --root dist

      - name: Verify packaged native service workflow
        run: npm run build:verify-service-core -- --root dist

      - name: Configure Linux sandbox helper for launch verification
        run: |
          sudo chown root:root dist/linux-unpacked/chrome-sandbox
          sudo chmod 4755 dist/linux-unpacked/chrome-sandbox

      - name: Launch packaged application
        run: xvfb-run -a npm run build:verify-app-launch -- --root dist

      - name: Record exact installer evidence
        run: >-
          npm run build:verify-package-smoke --
          --root dist
          --platform linux
          --arch x64
          --source-revision ${{ github.sha }}
          --manifest dist/package-smoke-linux-x64.json

      - name: Enforce public-release legal materials
        run: npm run build:verify-release-legal
        env:
          SYNCSHOW_RELEASE_SOURCE_DIR: ${{ github.workspace }}/release-sources

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/package-smoke-*.json
            dist/packaged-launch-*.json
          if-no-files-found: error
          retention-days: 30

  create-release:
    needs: [check-version, prepare-sources, build-windows, build-mac, build-linux]
    if: needs.check-version.outputs.version_changed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install artifact verification dependencies
        run: npm ci

      - name: Generate release notes
        id: notes
        run: |
          NOTES=$(bash scripts/generate_release_notes.sh)
          # Write to multiline output
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Detect prerelease
        id: prerelease
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          if echo "$VERSION" | grep -qiE '[-](alpha|beta|rc|dev|preview)'; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Verify every installer and source asset before publication
        run: node scripts/verify-release-artifacts.js --root artifacts --source-revision ${{ github.sha }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: SyncShow v${{ needs.check-version.outputs.version }}
          draft: false
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          files: |
            artifacts/windows-installer/*.exe
            artifacts/macos-installer-*/*.dmg
            artifacts/macos-installer-*/*.zip
            artifacts/linux-installer/*.AppImage
            artifacts/linux-installer/*.deb
            artifacts/corresponding-sources/*-corresponding-sources.zip
            artifacts/corresponding-sources/release-source-receipt.json
            artifacts/*/package-smoke-*.json
            artifacts/*/packaged-launch-*.json
            artifacts/SHA256SUMS
          body: |
            ## SyncShow v${{ needs.check-version.outputs.version }}

            ### What's New
            ${{ steps.notes.outputs.content }}

            ### Downloads
            - **Windows**: `SyncShow Setup ${{ needs.check-version.outputs.version }}.exe`
            - **macOS Apple Silicon**: `SyncShow-${{ needs.check-version.outputs.version }}-arm64.dmg`
            - **macOS Intel**: `SyncShow-${{ needs.check-version.outputs.version }}-x64.dmg`
            - **Linux**: `SyncShow-${{ needs.check-version.outputs.version }}.AppImage` or `.deb`

            ### Getting ready for church
            - Native Heritage Community services work without Office or LibreOffice.
            - For legacy slide-deck conversion, Windows prefers PowerPoint and falls back to LibreOffice; macOS/Linux use LibreOffice.
            - Direct Google Drive integration is optional and is not configured in these installers. Community and local service files work independently.
            - macOS installers are ad-hoc signed, not Developer ID signed or notarized. Windows installers are not Authenticode signed.
            - All four native targets passed packaged launch, image/PDF, service-core, artifact-integrity, and dependency-source checks. Physical Windows venue rehearsal remains required.
            - SHA256SUMS and exact corresponding-source materials are attached to this release.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
