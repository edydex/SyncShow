name: Deploy public site

on:
  push:
    branches:
      - main
    paths:
      - 'docs/site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate static site boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/site/index.html
          test -f docs/site/privacy.html
          test -f docs/site/terms.html
          test -f docs/site/styles.css
          test -z "$(find docs/site -type l -print -quit)"
          test "$(find docs/site -type f -size +2M -print -quit)" = ""
          grep -Fq 'href="./privacy.html"' docs/site/index.html
          grep -Fq 'href="./terms.html"' docs/site/index.html
          grep -Fq 'Google API Services User Data Policy' docs/site/privacy.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs/site

  deploy:
    name: Deploy site
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
