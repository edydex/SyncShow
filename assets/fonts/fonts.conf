<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Keep native slide rendering independent of fonts installed on the
       operator's computer. This directory is resolved beside this file. -->
  <dir prefix="relative">.</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <config>
    <rescan><int>0</int></rescan>
  </config>
</fontconfig>
